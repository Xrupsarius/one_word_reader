<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Читалка по одному слову</title>
<style>
:root{--bg:#e9eef1;--surface:#f7f9fa;--ink:#13233a;--muted:#5b6b7d;--line:#c5d0d8;--focus:#c2185b;--btn:#13233a;--btn-ink:#f7f9fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a26;--surface:#17283a;--ink:#e6edf3;--muted:#8fa2b5;--line:#2b405a;--focus:#ff5c93;--btn:#e6edf3;--btn-ink:#0f1a26}}
:root[data-theme="dark"]{--bg:#0f1a26;--surface:#17283a;--ink:#e6edf3;--muted:#8fa2b5;--line:#2b405a;--focus:#ff5c93;--btn:#e6edf3;--btn-ink:#0f1a26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:34vh;min-height:190px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font:500 clamp(34px,10vw,56px)/1 Charter,Georgia,"Times New Roman",serif;overflow:hidden;position:relative}
.stage::before,.stage::after{content:"";position:absolute;left:50%;width:2px;height:14px;background:var(--focus);opacity:.55;transform:translateX(-1px)}
.stage::before{top:0}.stage::after{bottom:0}
#l{text-align:right;white-space:pre}#c{color:var(--focus)}#r{text-align:left;white-space:pre}
.bar{height:6px;background:var(--line);border-radius:3px;margin:14px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--focus)}
.info{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;margin:14px 0}
button,.file{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
#play{flex:1;background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,.file:focus-within{outline:3px solid var(--focus);outline-offset:2px}
label{display:block;margin:14px 0 4px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--focus)}
textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:10px;resize:vertical}
.file input{position:absolute;opacity:0;width:0;height:0}
.file{display:inline-block;position:relative}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage" aria-live="off"><span id="l"></span><span id="c">Готов</span><span id="r"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="info"><span id="pos">0 / 0</span><span id="left"></span></div>
  <div class="row">
    <button id="back" aria-label="Предложение назад">⏮</button>
    <button id="play">Читать</button>
    <button id="fwd" aria-label="Предложение вперёд">⏭</button>
  </div>
  <input type="range" id="seek" min="0" value="0" aria-label="Позиция в тексте">
  <label for="wpm">Скорость: <span id="wv">300</span> слов/мин</label>
  <input type="range" id="wpm" min="100" max="1000" step="25" value="300">
  <label for="txt">Текст</label>
  <textarea id="txt"></textarea>
  <div class="row"><label class="file">Открыть .txt<input type="file" id="file" accept=".txt,text/plain"></label><button id="load">Обновить текст</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const SAMPLE="Быстрое чтение основано на простой идее: глаз не должен бегать по строке. Слово появляется на одном и том же месте, а мозг успевает его понять. Красная буква помогает взгляду зацепиться за центр слова. Попробуй увеличить скорость: сначала триста слов в минуту, потом четыреста, потом пятьсот. Пауза после точки даёт время осмыслить предложение, а длинные слова показываются чуть дольше. Вставь сюда любую книгу и нажми «Читать».";
let words=[],i=0,timer=null,playing=false;
$("txt").value=SAMPLE;
const clean=w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
function setText(t){stop();words=t.split(/\s+/).filter(Boolean);i=0;$("seek").max=Math.max(0,words.length-1);$("seek").value=0;updateInfo();$("l").textContent="";$("c").textContent="Готов";$("r").textContent=""}
function orp(n){return n<=1?0:n<=5?1:n<=9?2:n<=13?3:4}
function show(w){const core=clean(w),lead=w.indexOf(core.charAt(0)),p=(lead<0?0:lead)+orp(core.length);
$("l").textContent=w.slice(0,p);$("c").textContent=w.charAt(p);$("r").textContent=w.slice(p+1)}
function delay(w){let d=60000/+$("wpm").value,n=clean(w).length;
if(/[.!?…]["»”)]*$/.test(w))d*=2.2;else if(/[,;:—–]["»”)]*$/.test(w))d*=1.6;
if(n>12)d*=1.5;else if(n>8)d*=1.3;return d}
function updateInfo(){$("pos").textContent=i+" / "+words.length;
$("fill").style.width=(words.length?i/words.length*100:0)+"%";
const m=(words.length-i)/+$("wpm").value;$("left").textContent=words.length?"осталось ~"+(m<1?"меньше минуты":Math.round(m)+" мин"):"";$("seek").value=Math.min(i,words.length-1)}
function tick(){if(i>=words.length){stop();return}
const w=words[i];show(w);i++;updateInfo();timer=setTimeout(tick,delay(w))}
function play(){if(!words.length)return;if(i>=words.length)i=0;playing=true;$("play").textContent="Пауза";tick()}
function stop(){playing=false;clearTimeout(timer);$("play").textContent="Читать"}
function toggle(){playing?stop():play()}
function jump(dir){const was=playing;stop();
if(dir<0){let k=Math.max(0,i-2);while(k>0&&!/[.!?…]["»”)]*$/.test(words[k-1]))k--;i=k}
else{let k=i;while(k<words.length-1&&!/[.!?…]["»”)]*$/.test(words[k]))k++;i=Math.min(words.length-1,k+1)}
if(words[i]){show(words[i]);i++}updateInfo();if(was)play()}
$("play").onclick=toggle;$("back").onclick=()=>jump(-1);$("fwd").onclick=()=>jump(1);
$("wpm").oninput=e=>{$("wv").textContent=e.target.value;updateInfo()};
$("seek").oninput=e=>{i=+e.target.value;if(words[i])show(words[i]);updateInfo()};
$("load").onclick=()=>setText($("txt").value);
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("txt").value=r.result;setText(r.result)};r.readAsText(f)};
document.addEventListener("keydown",e=>{if(/TEXTAREA|INPUT/.test(document.activeElement.tagName)&&document.activeElement.type!=="range")return;
if(e.code==="Space"){e.preventDefault();toggle()}else if(e.code==="ArrowLeft")jump(-1);else if(e.code==="ArrowRight")jump(1)});
setText(SAMPLE);
</script>
</body>
</html>
